name: Generated APK (Upload - Create Artifact To Github Action)

on:
  push:
    tags:
      - 'v.10.7.0'

permissions:
  contents: write

env:
  main_project_module: app
  playstore_name: Feng

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 提取当前 Tag 并移除 'v' 前缀（例如 v1.0.0 → 1.0.0）
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 更新 build.gradle.kts 中的 versionName
      - name: Update versionName in build.gradle.kts
        run: |
          sed -i "s|versionName = \".*\"|versionName = \"${{ steps.extract_version.outputs.version }}\"|" ${{ env.main_project_module }}/build.gradle.kts
          cat ${{ env.main_project_module }}/build.gradle.kts | grep versionName
          
      # 更新wstunnel
      - name: Run update_bin.sh
        run: bash ./update_bin.sh

      # 后续步骤（保持不变）
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run gradle tests
        run: ./gradlew test

      - name: Build gradle project
        run: ./gradlew build

      # ❗️ تعديل بسيط: بناء Debug بدل Release
      - name: Build APK debug
        run: ./gradlew assembleDebug

      # ❗️ حذف خطوة التوقيع بالكامل
      # (تمت إزالتها)

      # ❗️ حذف خطوة تنظيم ملفات Release لأنها تعتمد على ملفات غير موجودة
      # (تمت إزالتها)

      # رفع نسخة Debug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.playstore_name }} - APK Debug
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/

      # ❗️ حذف خطوة GitHub Release لأنها تعتمد على ملف Release موقّع
      # (تمت إزالتها)
